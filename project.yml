# The Xcode project is generated from this file with XcodeGen: run `xcodegen generate` after adding or moving files.
name: BetterDrop
options:
  bundleIdPrefix: com.patrickjakobsen
  xcodeVersion: "27.0"
  projectFormat: xcode16_0
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    # Sparkle compares build numbers, so they go up with the version.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    DEVELOPMENT_TEAM: 537P4FPMZ4
    CODE_SIGN_STYLE: Automatic
    # Xcode's recommended settings.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  BetterDropKit:
    path: Packages/BetterDropKit
  # Updates for the Mac app: finds new releases on GitHub and installs them.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0

schemes:
  BetterDrop macOS:
    build:
      targets:
        BetterDropMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: BetterDropKit/BetterDropCoreTests
        - package: BetterDropKit/BetterDropTransportTests
    profile:
      config: Release
    archive:
      config: Release
  BetterDrop iOS:
    build:
      targets:
        BetterDropiOS: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

targets:
  BetterDropMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared
    dependencies:
      - package: BetterDropKit
        product: BetterDropCore
      - package: BetterDropKit
        product: BetterDropTransport
      - package: BetterDropKit
        product: BetterDropUI
      - package: Sparkle
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_betterdrop._tcp]
        # Where Sparkle looks for new versions: the appcast attached to the latest GitHub release.
        SUFeedURL: https://github.com/Pallepadehat/BetterDrop/releases/latest/download/appcast.xml
        # The public half of the key releases are signed with (the private half is in the maintainer's keychain).
        SUPublicEDKey: ncfdKBzlwyP5UjwZHPHwXXvz0gzhwF3qMlndbp11XYQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: BetterDrop
        PRODUCT_MODULE_NAME: BetterDropMac
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickjakobsen.betterdrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BetterDrop
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Lives in the menu bar, not the Dock.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Patrick Jakobsen. MIT License.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: BetterDrop shines a Bluetooth beacon so your iPhone can tell when it's right next to your Mac. Nothing is sent over Bluetooth.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: BetterDrop sends files straight between your iPhone and your Mac on your local network. Nothing goes through the internet.
        # Sparkle installs updates in place, and received files go to ~/Downloads/BetterDrop, which the App Sandbox
        # makes awkward without a Developer ID. The hardened runtime is still on.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/BetterDrop.entitlements

  BetterDropiOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
    dependencies:
      - package: BetterDropKit
        product: BetterDropCore
      - package: BetterDropKit
        product: BetterDropTransport
      - package: BetterDropKit
        product: BetterDropUI
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_betterdrop._tcp]
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Big files go to the Mac's file server over plain HTTP on the local network (already end-to-end
        # encrypted with the pairing key), which is what lets iOS keep moving them in the background.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_NAME: BetterDrop
        PRODUCT_MODULE_NAME: BetterDropiOS
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickjakobsen.betterdrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: BetterDrop
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Received files show up in the Files app, under On My iPhone → BetterDrop.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: BetterDrop listens for your Mac's Bluetooth beacon to know when you're holding your iPhone right next to it.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: BetterDrop finds your Mac and sends files straight to it on your local network. Nothing goes through the internet.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save pictures and videos you receive to your photo library.
